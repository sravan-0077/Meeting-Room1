version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME}/auth-backend:latest
    container_name:
    restart: unless-stopped
    ports:
      - "8089:8089"
    environment:
      - PORT=8089

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME:-local}/auth-frontend:latest
    container_name: 
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
