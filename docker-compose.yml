version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-local}/auth-backend:latest
    container_name: auth-backend
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - PORT=8088

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-local}/auth-frontend:latest
    container_name: auth-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
